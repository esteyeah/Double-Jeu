# Déploiement en un clic sur Render (https://render.com).
# Un seul service web, gratuit : le site et le serveur de jeu partagent la même adresse.
# Les comptes et les mots ajoutés vont dans une base PostgreSQL externe et gratuite (ex. Neon),
# car les bases gratuites de Render expirent au bout de 30 jours.
services:
  - type: web
    name: double-jeu
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10.28.0 && NODE_ENV=development pnpm install --frozen-lockfile && pnpm build
    startCommand: node scripts/play.mjs --no-build
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SERVER_URL
        value: same-origin
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Adresse de la base (postgresql://…), demandée au déploiement. Modifiable ensuite dans « Environment ».
      - key: DATABASE_URL
        sync: false
      # Pseudo(s) administrateur(s), séparés par des virgules. Demandé au déploiement.
      - key: ADMIN_USERS
        sync: false
